# Deploy transcript-worker (post-meeting MoM worker) to Cloud Run.
#
# Run manually from the GitHub "Actions" tab. Uses Vertex AI (cheap Flash-Lite)
# via Google's OpenAI-compatible Chat Completions endpoint for MoM. Auth is the
# runtime service account's ADC — no LLM_API_KEY secret.
#
# Required repository secrets: GCP_PROJECT_ID, GCP_WIF_PROVIDER, GCP_DEPLOY_SA
# Required Secret Manager secrets: supabase-url, supabase-service-role-key.
# Runtime SA needs roles/aiplatform.user (granted below / docs/DEPLOYMENT.md §5).

name: Deploy transcript-worker

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Image tag (default: git short sha)"
        required: false
        default: ""

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-transcript-worker
  cancel-in-progress: false

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  REGION: asia-southeast1
  REPO: vmtb-services
  SERVICE: transcript-worker
  RUNTIME_SA: vmtb-services

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SA }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Resolve image tag
        id: tag
        run: |
          if [ -n "${{ inputs.image_tag }}" ]; then
            echo "tag=${{ inputs.image_tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          fi

      # Submit asynchronously and poll status: the CI identity cannot stream
      # logs from the default logs bucket (needs project Viewer), which made
      # gcloud exit non-zero even on successful builds.
      - name: Build image (Cloud Build)
        run: |
          set -euo pipefail
          IMAGE="$REGION-docker.pkg.dev/$PROJECT_ID/$REPO/$SERVICE:${{ steps.tag.outputs.tag }}"
          BUILD_ID=$(gcloud builds submit "$SERVICE" \
            --project "$PROJECT_ID" \
            --tag "$IMAGE" \
            --format='value(id)' \
            --async)
          echo "Build id: $BUILD_ID"
          for i in $(seq 1 90); do
            STATUS=$(gcloud builds describe "$BUILD_ID" --project "$PROJECT_ID" --format='value(status)')
            echo "[$i] status: $STATUS"
            case "$STATUS" in
              SUCCESS) exit 0 ;;
              FAILURE|CANCELLED|TIMEOUT|INTERNAL_ERROR)
                echo "::error::Cloud Build $BUILD_ID finished with $STATUS - inspect logs at https://console.cloud.google.com/cloud-build/builds/$BUILD_ID?project=$PROJECT_ID"
                exit 1 ;;
            esac
            sleep 20
          done
          echo "::error::Timed out waiting for Cloud Build $BUILD_ID"
          exit 1

      - name: Deploy to Cloud Run
        run: |
          # Auto-VM-stop hook: the worker POSTs /stop-jitsi here after every
          # processed meeting (guarded by live-session checks).
          ACT_URL=$(gcloud run services describe jitsi-activation-backend \
            --project "$PROJECT_ID" --region "$REGION" \
            --format 'value(status.url)' 2>/dev/null || true)
          if [ -z "$ACT_URL" ]; then
            echo "::warning::jitsi-activation-backend not found; automatic VM stop will be disabled"
          fi

          # Vertex AI Chat Completions: ADC only (no API key secret).
          gcloud projects add-iam-policy-binding "$PROJECT_ID" \
            --member="serviceAccount:${RUNTIME_SA}@${PROJECT_ID}.iam.gserviceaccount.com" \
            --role="roles/aiplatform.user" \
            --condition=None \
            --quiet || echo "::warning::could not grant roles/aiplatform.user — grant it manually (docs/DEPLOYMENT.md §5)"

          gcloud run deploy "$SERVICE" \
            --project "$PROJECT_ID" \
            --region "$REGION" \
            --image "$REGION-docker.pkg.dev/$PROJECT_ID/$REPO/$SERVICE:${{ steps.tag.outputs.tag }}" \
            --service-account "$RUNTIME_SA@$PROJECT_ID.iam.gserviceaccount.com" \
            --no-allow-unauthenticated \
            --min-instances 0 \
            --max-instances 5 \
            --timeout 600 \
            --set-env-vars "GCS_BUCKET=vmtb-transcripts,GCP_PROJECT_ID=$PROJECT_ID,LLM_PROVIDER=vertex,LLM_MODEL=google/gemini-3.1-flash-lite,JITSI_ACTIVATOR_URL=$ACT_URL" \
            --set-secrets "SUPABASE_URL=supabase-url:latest,SUPABASE_SERVICE_ROLE_KEY=supabase-service-role-key:latest"

      - name: Show service URL
        run: |
          gcloud run services describe "$SERVICE" \
            --project "$PROJECT_ID" --region "$REGION" \
            --format 'value(status.url)'

      # Keeps the Pub/Sub -> worker link correct on every deploy: creates the
      # push subscription the first time, updates it afterwards. Auth is OIDC:
      # Pub/Sub signs calls as RUNTIME_SA, which must have run.invoker on this
      # service (granted in docs/DEPLOYMENT.md §2.3).
      - name: Wire Pub/Sub push subscription
        run: |
          WORKER_URL=$(gcloud run services describe "$SERVICE" \
            --project "$PROJECT_ID" --region "$REGION" --format 'value(status.url)')

          gcloud pubsub subscriptions create meeting-transcripts-worker \
            --topic=meeting-transcripts \
            --push-endpoint="${WORKER_URL}/pubsub/push" \
            --push-auth-service-account="${RUNTIME_SA}@${PROJECT_ID}.iam.gserviceaccount.com" \
            --ack-deadline=60 \
          || gcloud pubsub subscriptions update meeting-transcripts-worker \
            --push-endpoint="${WORKER_URL}/pubsub/push" \
            --push-auth-service-account="${RUNTIME_SA}@${PROJECT_ID}.iam.gserviceaccount.com"
