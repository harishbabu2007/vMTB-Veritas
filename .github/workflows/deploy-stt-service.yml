# Deploy stt-service (streaming Whisper) to Cloud Run with an L4 GPU.
#
# Run manually from the GitHub "Actions" tab -> select this workflow -> "Run
# workflow". Build takes a while the first time (~15 min: CUDA wheels + the
# baked `medium` model), later builds are faster thanks to layer caching.
#
# Required repository secrets (Settings -> Secrets and variables -> Actions):
#   GCP_PROJECT_ID      - your GCP project id
#   GCP_WIF_PROVIDER    - Workload Identity Federation provider resource name
#   GCP_DEPLOY_SA       - deployer service account email
# See docs/DEPLOYMENT.md for one-time setup of all three.

name: Deploy stt-service

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Image tag (default: git short sha)"
        required: false
        default: ""
      region:
        description: "Deployment region (asia-south1 requires invite-only L4 access)"
        required: false
        default: "asia-southeast1"

permissions:
  contents: read
  id-token: write # required for Workload Identity Federation

concurrency:
  group: deploy-stt-service
  cancel-in-progress: false

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  REGION: ${{ github.event.inputs.region || 'asia-southeast1' }} # must be a Cloud Run GPU region (L4)
  REPO: vmtb-services
  SERVICE: stt-service
  RUNTIME_SA: vmtb-services # runtime service account (name only)

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SA }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Resolve image tag
        id: tag
        run: |
          if [ -n "${{ inputs.image_tag }}" ]; then
            echo "tag=${{ inputs.image_tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          fi

      # Submit asynchronously and poll status: the CI identity cannot stream
      # logs from the default logs bucket (needs project Viewer), which made
      # gcloud exit non-zero even on successful builds. Long timeout because
      # the first build bakes the Whisper model (~15-25 min).
      - name: Build image (Cloud Build)
        run: |
          set -euo pipefail
          IMAGE="$REGION-docker.pkg.dev/$PROJECT_ID/$REPO/$SERVICE:${{ steps.tag.outputs.tag }}"
          BUILD_ID=$(gcloud builds submit "$SERVICE" \
            --project "$PROJECT_ID" \
            --config "$SERVICE/cloudbuild.yaml" \
            --substitutions "_IMAGE=$IMAGE,_STT_DEVICE=gpu,_STT_MODEL=medium" \
            --format='value(id)' \
            --async)
          echo "Build id: $BUILD_ID"
          for i in $(seq 1 100); do
            STATUS=$(gcloud builds describe "$BUILD_ID" --project "$PROJECT_ID" --format='value(status)')
            echo "[$i] status: $STATUS"
            case "$STATUS" in
              SUCCESS) exit 0 ;;
              FAILURE|CANCELLED|TIMEOUT|INTERNAL_ERROR)
                echo "::error::Cloud Build $BUILD_ID finished with $STATUS - inspect logs at https://console.cloud.google.com/cloud-build/builds/$BUILD_ID?project=$PROJECT_ID"
                exit 1 ;;
            esac
            sleep 30
          done
          echo "::error::Timed out waiting for Cloud Build $BUILD_ID"
          exit 1

      - name: Deploy to Cloud Run (GPU)
        run: |
          gcloud run deploy "$SERVICE" \
            --project "$PROJECT_ID" \
            --region "$REGION" \
            --image "$REGION-docker.pkg.dev/$PROJECT_ID/$REPO/$SERVICE:${{ steps.tag.outputs.tag }}" \
            --service-account "$RUNTIME_SA@$PROJECT_ID.iam.gserviceaccount.com" \
            --gpu 1 \
            --gpu-type nvidia-l4 \
            --memory 16Gi \
            --cpu 4 \
            --concurrency 1 \
            --min-instances 0 \
            --max-instances 3 \
            --timeout 3600 \
            --no-allow-unauthenticated \
            --no-gpu-zonal-redundancy \
            --set-env-vars "STT_MODEL=medium,STT_DEVICE=cuda,STT_COMPUTE_TYPE=float16,STT_MIN_COMMIT_WORDS=12,STT_IDLE_TIMEOUT_SECONDS=300"

      - name: Show service URL
        run: |
          gcloud run services describe "$SERVICE" \
            --project "$PROJECT_ID" --region "$REGION" \
            --format 'value(status.url)'
