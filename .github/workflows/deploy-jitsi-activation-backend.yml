# Deploy jitsi-activation-backend (meeting infrastructure activator) to Cloud Run.
#
# This service starts/stops the Jitsi VM and wakes the scale-to-zero STT and
# proxy services before a meeting. It runs with Application Default
# Credentials - the runtime service account below needs:
#   roles/compute.instanceAdmin.v1 (or scoped start/stop/get on jitsi-vm)
#   roles/run.developer            (read + update stt-service / proxy)
#   actAs on vmtb-services@...     (to patch services that use that SA)
# See docs/DEPLOYMENT.md for the exact commands.
#
# Required repository secrets: GCP_PROJECT_ID, GCP_WIF_PROVIDER, GCP_DEPLOY_SA

name: Deploy jitsi-activation-backend

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Image tag (default: git short sha)"
        required: false
        default: ""

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-jitsi-activation-backend
  cancel-in-progress: false

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  REGION: asia-southeast1
  REPO: vmtb-services
  SERVICE: jitsi-activation-backend
  RUNTIME_SA: vmtb-activator

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SA }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Resolve image tag
        id: tag
        run: |
          if [ -n "${{ inputs.image_tag }}" ]; then
            echo "tag=${{ inputs.image_tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          fi

      # Submit asynchronously and poll status: the CI identity cannot stream
      # logs from the default logs bucket (needs project Viewer), which made
      # gcloud exit non-zero even on successful builds.
      - name: Build image (Cloud Build)
        run: |
          set -euo pipefail
          IMAGE="$REGION-docker.pkg.dev/$PROJECT_ID/$REPO/$SERVICE:${{ steps.tag.outputs.tag }}"
          BUILD_ID=$(gcloud builds submit "$SERVICE" \
            --project "$PROJECT_ID" \
            --tag "$IMAGE" \
            --format='value(id)' \
            --async)
          echo "Build id: $BUILD_ID"
          for i in $(seq 1 90); do
            STATUS=$(gcloud builds describe "$BUILD_ID" --project "$PROJECT_ID" --format='value(status)')
            echo "[$i] status: $STATUS"
            case "$STATUS" in
              SUCCESS) exit 0 ;;
              FAILURE|CANCELLED|TIMEOUT|INTERNAL_ERROR)
                echo "::error::Cloud Build $BUILD_ID finished with $STATUS - inspect logs at https://console.cloud.google.com/cloud-build/builds/$BUILD_ID?project=$PROJECT_ID"
                exit 1 ;;
            esac
            sleep 20
          done
          echo "::error::Timed out waiting for Cloud Build $BUILD_ID"
          exit 1

      # Public (allow-unauthenticated): the browser-based jitsi-frontend polls
      # /start-jitsi directly, exactly like the previous Render deployment.
      - name: Deploy to Cloud Run
        run: |
          ENV_VARS="GCP_PROJECT_ID=$PROJECT_ID,GCP_ZONE=asia-south1-c,JITSI_INSTANCE_NAME=jitsi-vm,GCP_REGION=$REGION,STT_SERVICE_NAME=stt-service,PROXY_SERVICE_NAME=opus-transcriber-proxy,JITSI_PUBLIC_URL=https://server-vmtb-v2.3billionpairs.com,JITSI_PROBE_TIMEOUT_SECONDS=5"

          # Merge env vars on later deploys so manually added ones (e.g.
          # CORS_ORIGINS, see docs/DEPLOYMENT.md §7.3) survive redeploys.
          if gcloud run services describe "$SERVICE" \
               --project "$PROJECT_ID" --region "$REGION" >/dev/null 2>&1; then
            ENV_FLAG="--update-env-vars"
          else
            ENV_FLAG="--set-env-vars"
          fi

          gcloud run deploy "$SERVICE" \
            --project "$PROJECT_ID" \
            --region "$REGION" \
            --image "$REGION-docker.pkg.dev/$PROJECT_ID/$REPO/$SERVICE:${{ steps.tag.outputs.tag }}" \
            --service-account "$RUNTIME_SA@$PROJECT_ID.iam.gserviceaccount.com" \
            --allow-unauthenticated \
            --min-instances 0 \
            --max-instances 3 \
            --timeout 120 \
            "$ENV_FLAG" "$ENV_VARS"

      - name: Show service URL
        run: |
          gcloud run services describe "$SERVICE" \
            --project "$PROJECT_ID" --region "$REGION" \
            --format 'value(status.url)'
