<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="https://i.ibb.co/vxP6Cs3c/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>vMTB</title>
    <meta property="og:image" content="https://i.ibb.co/vxP6Cs3c/logo.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://i.ibb.co/vxP6Cs3c/logo.png" />
    <script>
      /* First paint, before React. Mirrors src/utils/themeStorage.ts — keep the
         two in agreement. Default is LIGHT: the OS preference is consulted only
         for someone who explicitly chose "System". The hint is keyed by the
         signed-in user's id (read from the same cached-user key AuthContext
         uses), so on a shared computer one person's theme is never painted for
         another, and a signed-out visitor always gets light. */
      (function () {
        try {
          var dark = false;
          var raw = localStorage.getItem('vmtb.auth.user');
          var id = raw ? JSON.parse(raw).id : null;
          var pref = id ? localStorage.getItem('vmtb-theme:' + id) : null;
          if (pref === 'dark') {
            dark = true;
          } else if (pref === 'system') {
            dark = !!(window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
          }
          if (dark) document.documentElement.classList.add('dark');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
